<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Edit Book</title>
  </head>
  <body>
    <h1>Edit Book</h1>

    <form th:object="${book}" th:action="@{/save}" method="post">
      <input type="hidden" th:field="*{id}" />

      Title:
      <input type="text" th:field="*{title}" /><br />

      Author:
      <input type="text" th:field="*{author}" /><br />

      Year:
      <input type="number" th:field="*{publicationYear}" /><br />

      ISBN:
      <input type="text" th:field="*{isbn}" /><br />

      Price:
      <input type="number" step="0.01" th:field="*{price}" /><br />

      Category:
      <select th:field="*{category}">
        <option
          th:each="category : ${categories}"
          th:value="${category.id}"
          th:text="${category.name}"
        ></option>
      </select>
      <br /><br />

      <input type="submit" value="Save" />
    </form>
  </body>
</html>
